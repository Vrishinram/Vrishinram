name: Generate Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate contribution snake
        uses: Platane/snk@v3
        with:
          github_user_name: Vrishinram
          github_token: ${{ secrets.PAT_TOKEN || secrets.GITHUB_TOKEN }}
          outputs: |
            dist/github-snake.svg?color_snake=#00FF88
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#00FF88

      - name: Publish generated snake to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}